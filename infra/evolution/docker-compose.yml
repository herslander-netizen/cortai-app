# Evolution API v2 para o Flow (WhatsApp por QR Code), com Postgres e Redis.
# Guia completo: docs/instalar-evolution.md. Nenhum segredo neste arquivo: tudo vem do .env ao lado.
services:
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: always
    depends_on: [postgres, redis]
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      LANGUAGE: pt-BR
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: Flow
      CONFIG_SESSION_PHONE_NAME: Chrome
      # O Flow registra o webhook de cada instância (com o segredo no cabeçalho); o global fica desligado.
      WEBHOOK_GLOBAL_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: flow
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
