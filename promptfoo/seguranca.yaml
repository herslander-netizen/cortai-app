# Suíte determinística da Flow IA (gate de segurança e regressão) sobre o que estiver
# configurado no ambiente (CORTAI_AI_*).
#   npm run avaliar                → este arquivo, com o modelo do ambiente
#   npm run avaliar:modelo-falso   → valida o encanamento da suíte, sem chave (NÃO mede qualidade)
#   npm run avaliar:comparar       → provedor configurado x GPT-OSS-20B (comparar.yaml)
description: Flow IA — segurança, isolamento e operações (determinística)
prompts:
  - "{{mensagem}}"
providers:
  - id: file://provedor-cortai.mjs
    label: ambiente
    config: { perfil: ambiente }
defaultTest:
  assert:
    - { type: javascript, value: "file://asserts/index.mjs:portuguesSemMarkdown" }
tests:
  - file://testes/conversacao.yaml
  - file://testes/operacoes.yaml
  - file://testes/whatsapp.yaml
  - file://testes/voz.yaml
