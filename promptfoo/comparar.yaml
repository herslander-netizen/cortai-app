# Fase C — a mesma suíte com o provedor independente configurado e com GPT-OSS-20B.
# Precisa de CORTAI_AI_* e PROMPTFOO_OSS_BASE_URL / PROMPTFOO_OSS_MODEL / PROMPTFOO_OSS_API_KEY.
# Sem alguma variável obrigatória, o provedor devolve erro explícito (nada é "aprovado" sem avaliar).
description: Flow IA — provedor configurado x GPT-OSS-20B
prompts:
  - "{{mensagem}}"
providers:
  - id: file://provedor-cortai.mjs
    label: ambiente
    config: { perfil: ambiente }
  - id: file://provedor-cortai.mjs
    label: gpt-oss-20b
    config: { perfil: oss }
defaultTest:
  assert:
    - { type: javascript, value: "file://asserts/index.mjs:portuguesSemMarkdown" }
tests:
  - file://testes/conversacao.yaml
  - file://testes/operacoes.yaml
  - file://testes/whatsapp.yaml
  - file://testes/voz.yaml
