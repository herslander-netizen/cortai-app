# Fase C — a MESMA suíte com o modelo atual (Lovable AI Gateway) e com GPT-OSS-20B.
# Precisa de LOVABLE_API_KEY e PROMPTFOO_OSS_BASE_URL / PROMPTFOO_OSS_MODEL / PROMPTFOO_OSS_API_KEY.
# Sem uma delas, o provedor correspondente devolve erro explícito (nada é "aprovado" sem avaliar).
description: CortAI — modelo atual x GPT-OSS-20B
prompts:
  - "{{mensagem}}"
providers:
  - id: file://provedor-cortai.mjs
    label: atual
    config: { perfil: atual }
  - id: file://provedor-cortai.mjs
    label: gpt-oss-20b
    config: { perfil: oss }
defaultTest:
  assert:
    - { type: javascript, value: "file://asserts/index.mjs:portuguesSemMarkdown" }
tests:
  - file://testes/conversacao.yaml
  - file://testes/operacoes.yaml
  - file://testes/whatsapp.yaml
  - file://testes/voz.yaml
