name: Deploy isolated preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Type PREVIEW to deploy only the isolated test Worker"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13' && inputs.confirm_preview == 'PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
      - name: Build
        run: bun run build
      - name: Deploy isolated preview Worker
        run: bunx wrangler deploy --name cortai-reconstruction-test-2026
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
