name: Deploy isolated preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Type PREVIEW to deploy only the isolated test Worker"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13' && inputs.confirm_preview == 'PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify isolated preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required isolated-preview secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Preview deployment stopped before build/deploy. Configure preview-only credentials; production credentials must not be used."
            exit 1
          fi
      - name: TypeScript
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy isolated preview Worker
        run: bunx wrangler deploy --config wrangler.jsonc --name cortai-reconstruction-test-2026
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
