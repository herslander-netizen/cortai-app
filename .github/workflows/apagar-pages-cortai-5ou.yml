name: Apagar projeto Pages antigo (cortai-5ou)

# Uso único, pedido pelo dono em 16/10: apaga o projeto Pages "cortai" (cortai-5ou.pages.dev),
# criado por engano na primeira publicação e sem uso. Só apaga se o endereço conferir.
# O site principal é o projeto "cortaiapp" e nunca é tocado aqui.
on:
  push:
    branches: [cloudflare-workers-migration-2026-10-13]
    paths: [.github/workflows/apagar-pages-cortai-5ou.yml]
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite APAGAR para apagar o projeto cortai (cortai-5ou.pages.dev)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apagar:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmar == 'APAGAR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apagar o projeto cortai (só se for cortai-5ou.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cortai"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          resp="$(curl -sS "${auth[@]}" "$api")"
          if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
            echo "Projeto cortai não existe mais. Nada a fazer."; exit 0
          fi
          sub="$(jq -r '.result.subdomain' <<<"$resp")"
          if [ "$sub" != "cortai-5ou.pages.dev" ]; then
            echo "::error::O projeto cortai tem o endereço $sub, não cortai-5ou.pages.dev. Não apaguei."; exit 1
          fi
          # A Cloudflare só apaga o projeto depois de apagar as publicações dele.
          ids="$(curl -sS "${auth[@]}" "$api/deployments?per_page=25" | jq -r '.result[].id')"
          for id in $ids; do
            curl -sS "${auth[@]}" -X DELETE "$api/deployments/$id?force=true" | jq -c '{id: "'"$id"'", success}'
          done
          r="$(curl -sS "${auth[@]}" -X DELETE "$api")"
          if [ "$(jq -r '.success' <<<"$r")" != "true" ]; then
            echo "::error::Não consegui apagar: $(jq -c '.errors' <<<"$r")"; exit 1
          fi
          echo "Projeto cortai (cortai-5ou.pages.dev) apagado."
