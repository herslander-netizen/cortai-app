name: Refresh Bun lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bun-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh lockfile
        run: bun install --lockfile-only

      - name: Commit updated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile"
          git push origin HEAD:cloudflare-workers-migration-2026-10-13
