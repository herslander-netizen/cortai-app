name: Montar banco isolado da prévia (cortai-preview)

# Executado uma vez por alteração explícita deste workflow.
# Alvo fixo: projeto Supabase de prévia, nunca cortai-prod.
# A baseline recusa qualquer banco cujo schema public já tenha tabelas.
on:
  push:
    branches:
      - cloudflare-workers-migration-2026-10-13
    paths:
      - .github/workflows/montar-preview.yml

permissions:
  contents: read

concurrency:
  group: montar-cortai-preview
  cancel-in-progress: false

jobs:
  montar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch de migração
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13

      - name: Instalar baseline no projeto isolado
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJETO_ESPERADO: pfkxvindedkuktogbcsv
          URL_DO_APP: https://previa.cortaiapp.pages.dev
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN nos secrets do GitHub."
            exit 1
          fi
          # O script valida que public está vazio e executa toda a baseline numa transação.
          # O projeto é fixado acima para impedir uso acidental do banco de produção.
          bash supabase/baseline/aplicar-pela-api.sh
