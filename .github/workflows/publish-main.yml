name: Publish Cortaí to main

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type PUBLICAR to approve promotion of the tested migration branch to main
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cortai-publish-main
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm_publish == 'PUBLICAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
      - name: Production build
        run: bunx vite build --outDir /tmp/cortai-publish-build
      - name: Check no unexpected migrations are included
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only origin/main...HEAD | grep -E '(^|/)(drizzle|supabase/migrations|migrations)/'; then
            echo 'Refusing automatic publish: database migration files detected. Review and apply separately.'
            exit 1
          fi
      - name: Create or reuse pull request to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$REPO" --head cloudflare-workers-migration-2026-10-13 --base main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$existing" ]]; then
            gh pr create --repo "$REPO" --base main --head cloudflare-workers-migration-2026-10-13 --title 'Promote tested Cortaí migration' --body 'Created by the guarded publish workflow after TypeScript, tests, and production build passed. Review the diff and checks before merging. Database migrations are excluded from automatic publication.'
          else
            echo "Existing PR #$existing will be used; no duplicate created."
          fi
      - name: Report ready for final review
        run: echo 'Validation passed and a pull request to main is ready. Merge remains a separate explicit action.'
  reject-invalid-confirmation:
    if: ${{ inputs.confirm_publish != 'PUBLICAR' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Publication not authorized. Enter PUBLICAR to run the validation and create the PR.' && exit 1
