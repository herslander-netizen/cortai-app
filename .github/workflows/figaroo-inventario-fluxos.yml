name: Figaroo - Inventario dos fluxos

# Diagnostico estrutural e testes gerais (estes executados por Validate Flow).
# Nao acessa sistemas externos, segredos nem bancos; nao publica o produto.
on:
  pull_request:
    branches: [main, "cloudflare-workers-migration-2026-10-13"]
    paths:
      - ".github/workflows/figaroo-inventario-fluxos.yml"
      - "scripts/ci/figaroo-inventario-fluxos.mjs"
      - "src/routes/**"
      - "src/components/**"
      - "src/lib/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matriz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do PR
        uses: actions/checkout@v4
      - name: Inventariar as 23 areas e os testes existentes
        run: node scripts/ci/figaroo-inventario-fluxos.mjs
      - name: Publicar relatorio (nao e teste E2E)
        uses: actions/upload-artifact@v4
        with:
          name: figaroo-flow-matriz-23-areas
          path: test-results/figaroo/inventario.md
          if-no-files-found: error
          retention-days: 7
