name: Validate Flow

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "cloudflare-workers-migration-2026-10-13"]
  # A branch de migração já valida e publica no preview-migration.yml; manter aqui
  # criaria um segundo check verde que não confirma deploy.
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # TanStack Router gera src/routeTree.gen.ts no build. Sem isso o tsc
      # acusa falsos erros em rotas novas que já funcionam na prévia oficial.
      - name: Production build
        run: bunx vite build --outDir /tmp/cortai-build
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run

      - name: Save validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortai-build-${{ github.sha }}
          path: /tmp/cortai-build/
          if-no-files-found: error
          retention-days: 30
