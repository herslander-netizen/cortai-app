name: Validate Cortaí

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**", "teste-fora-lovable", "reconstrucao-independente-2026-10-13", "cloudflare-workers-migration-2026-10-13"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
      - name: Production build
        run: bunx vite build --outDir /tmp/cortai-build
