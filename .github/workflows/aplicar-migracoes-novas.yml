name: Aplicar migrações novas (cortai-prod)

# Aplica migrações novas no cortai-prod já montado, pela API do Supabase (SUPABASE_ACCESS_TOKEN).
# Só roda à mão, só nesta branch e com a confirmação digitada. Cada arquivo numa transação;
# arquivos já registrados em cortai_controle.migracoes_aplicadas são pulados.
on:
  # O push só registra a automação no GitHub; sem a confirmação APLICAR o job é pulado.
  push:
    branches: [cloudflare-workers-migration-2026-10-13]
    paths: [.github/workflows/aplicar-migracoes-novas.yml]
  workflow_dispatch:
    inputs:
      arquivos:
        description: "Migrações a aplicar, separadas por espaço (ex.: drizzle/migrations/0029_x.sql)"
        required: true
        type: string
      confirmar:
        description: "Digite APLICAR para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: montar-banco-novo
  cancel-in-progress: false

jobs:
  aplicar:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13' && inputs.confirmar == 'APLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Apply new migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJETO_ESPERADO: ibsberidejlbczxrweqg
          URL_DO_APP: https://cortai-reconstruction-test-2026.aprovamaisbarra.workers.dev
          ARQUIVOS: ${{ inputs.arquivos }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          # Só nomes de arquivo simples: letras, números, _, -, . e /.
          for a in $ARQUIVOS; do
            [[ "$a" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::Nome inválido: $a"; exit 1; }
          done
          bash supabase/baseline/aplicar-migracoes-novas.sh $ARQUIVOS
