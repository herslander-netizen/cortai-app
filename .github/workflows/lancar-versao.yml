name: Lançar versão (site principal)

# Lança uma versão numerada do Flow no site principal (Cloudflare Pages "cortaiapp" →
# https://cortaiapp.pages.dev). Cada lançamento:
#   1. testa (TypeScript e testes);
#   2. calcula a próxima versão a partir da última tag vX.Y (3.0 → 3.1, ou 3.x → 4.0 se "grande");
#   3. grava o número no app (src/lib/versao.ts e public/versao.json), faz o commit e a tag vX.Y;
#   4. publica e envia as variáveis do servidor;
#   5. cria a "Release" no GitHub com o que mudou e o id da publicação na Cloudflare,
#      que é o que o "Voltar versão" usa para voltar na hora.
# Não mexe no banco: migrações continuam pela automação própria, com autorização do dono.
on:
  push:
    branches: [cloudflare-workers-migration-2026-10-13]
    paths: [.github/workflows/lancar-versao.yml]
  workflow_dispatch:
    inputs:
      tipo:
        description: "Tipo de versão"
        required: true
        type: choice
        default: "nova (3.0 → 3.1)"
        options:
          - "nova (3.0 → 3.1)"
          - "grande (3.x → 4.0)"
      notas:
        description: "O que muda nesta versão (aparece na lista de versões)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cortai-lancar-versao
  cancel-in-progress: false

env:
  PROJETO_PAGES: cortaiapp
  RAMO: cloudflare-workers-migration-2026-10-13
  SUPABASE_URL_PUBLICA: https://ibsberidejlbczxrweqg.supabase.co
  SUPABASE_CHAVE_PUBLICA: sb_publishable_jGNr3ZXqTm603K_TtSK8rQ_sbQQT6IF

jobs:
  lancar:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependências
        run: bun install --frozen-lockfile
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Testes
        run: bunx vitest run

      # Falha antes de criar commit/tag se as credenciais essenciais de produção não estiverem configuradas.
      # Nunca usar o service-role da prévia no site principal.
      - name: Conferir credenciais de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          faltam=()
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!n}" ] || faltam+=("$n")
          done
          if (( ${#faltam[@]} > 0 )); then
            echo "::error::Publicação bloqueada antes de criar versão/tag. Configure os segredos de PRODUÇÃO ausentes: ${faltam[*]}."
            exit 1
          fi

      - name: Próxima versão
        id: versao
        env:
          TIPO: ${{ inputs.tipo }}
        run: |
          set -euo pipefail
          ultima="$(git tag --list 'v[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$ultima" ]; then
            atual="$(jq -r '.atual' public/versao.json)"; maior="${atual%%.*}"; resto="${atual#*.}"; menor="${resto%%.*}"
          else
            v="${ultima#v}"; maior="${v%%.*}"; menor="${v#*.}"; menor="${menor%%.*}"
          fi
          case "$TIPO" in
            grande*) maior=$((maior + 1)); menor=0 ;;
            *) menor=$((menor + 1)) ;;
          esac
          nova="$maior.$menor"
          echo "nova=$nova" >> "$GITHUB_OUTPUT"
          echo "anterior=${ultima:-nenhuma}" >> "$GITHUB_OUTPUT"
          echo "Versão anterior: ${ultima:-nenhuma} → nova: $nova"

      # Prepara os arquivos de versão no workspace, sem commit/tag/push ainda.
      - name: Preparar o número da versão
        env:
          NOVA: ${{ steps.versao.outputs.nova }}
        run: |
          set -euo pipefail
          sed -i -E "s/^export const VERSAO_INSTALADA = \"[0-9.]+\";/export const VERSAO_INSTALADA = \"$NOVA.0\";/" src/lib/versao.ts
          grep -q "VERSAO_INSTALADA = \"$NOVA.0\"" src/lib/versao.ts
          jq --arg v "$NOVA.0" '.atual = $v' public/versao.json > /tmp/versao.json && mv /tmp/versao.json public/versao.json

      # O build do artefato exato da versão candidata precisa passar antes de gravar tag ou commit.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL_PUBLICA }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_CHAVE_PUBLICA }}
          VITE_CORTAI_PUBLIC_URL: https://cortaiapp.pages.dev
        run: bunx vite build

      - name: Registrar commit e tag da versão validada
        env:
          NOVA: ${{ steps.versao.outputs.nova }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/versao.ts public/versao.json
          git commit -m "Versão $NOVA"
          git tag "v$NOVA"
          git push origin "HEAD:$RAMO" "v$NOVA"

      # O build gera um Worker (dist/server) e os estáticos (dist/client). No Pages o Worker vai
      # em _worker.js/ e os estáticos são servidos direto (lista em _routes.json).
      - name: Montar pacote do Pages
        run: |
          set -euo pipefail
          rm -rf .wrangler
          cd dist
          rm -f server/wrangler.json
          mv server client/_worker.js
          excluir=$(cd client && for f in *; do
            [ "$f" = "_worker.js" ] && continue
            if [ -d "$f" ]; then echo "/$f/*"; else echo "/$f"; fi
          done | jq -R . | jq -sc .)
          jq -n --argjson ex "$excluir" '{version:1, include:["/*"], exclude:$ex}' > client/_routes.json

      - name: Variáveis do servidor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ env.SUPABASE_URL_PUBLICA }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_CHAVE_PUBLICA }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CORTAI_PUBLIC_BASE_URL: https://cortaiapp.pages.dev
          CORTAI_CRON_SECRET: ${{ secrets.CORTAI_CRON_SECRET }}
          CORTAI_AI_PROVIDER: ${{ secrets.CORTAI_AI_PROVIDER }}
          CORTAI_AI_BASE_URL: ${{ secrets.CORTAI_AI_BASE_URL }}
          CORTAI_AI_MODEL: ${{ secrets.CORTAI_AI_MODEL }}
          CORTAI_AI_API_KEY: ${{ secrets.CORTAI_AI_API_KEY }}
          CORTAI_AI_CANAIS: ${{ secrets.CORTAI_AI_CANAIS }}
          CORTAI_AI_FALLBACK_BASE_URL: ${{ secrets.CORTAI_AI_FALLBACK_BASE_URL }}
          CORTAI_AI_FALLBACK_MODEL: ${{ secrets.CORTAI_AI_FALLBACK_MODEL }}
          CORTAI_AI_FALLBACK_API_KEY: ${{ secrets.CORTAI_AI_FALLBACK_API_KEY }}
          CORTAI_AI_FALLBACK_TIMEOUT_MS: ${{ secrets.CORTAI_AI_FALLBACK_TIMEOUT_MS }}
          CORTAI_AI_FALLBACK_REASONING_EFFORT: ${{ secrets.CORTAI_AI_FALLBACK_REASONING_EFFORT }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.META_WHATSAPP_PHONE_NUMBER_ID }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.META_WHATSAPP_APP_SECRET }}
          # Evolution API (WhatsApp por QR Code): ver docs/instalar-evolution.md.
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_WEBHOOK_SECRET: ${{ secrets.EVOLUTION_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          nomes=(SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY CORTAI_PUBLIC_BASE_URL
            CORTAI_CRON_SECRET CORTAI_AI_PROVIDER CORTAI_AI_BASE_URL CORTAI_AI_MODEL CORTAI_AI_API_KEY
            CORTAI_AI_CANAIS CORTAI_AI_FALLBACK_BASE_URL CORTAI_AI_FALLBACK_MODEL CORTAI_AI_FALLBACK_API_KEY
            CORTAI_AI_FALLBACK_TIMEOUT_MS CORTAI_AI_FALLBACK_REASONING_EFFORT
            META_WHATSAPP_ACCESS_TOKEN META_WHATSAPP_PHONE_NUMBER_ID
            META_WHATSAPP_VERIFY_TOKEN META_WHATSAPP_APP_SECRET
            EVOLUTION_API_URL EVOLUTION_API_KEY EVOLUTION_WEBHOOK_SECRET)
          json='{}'
          for n in "${nomes[@]}"; do
            v="$(printf '%s' "${!n}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$v" ] || continue
            json="$(jq -c --arg k "$n" --arg v "$v" '. + {($k): $v}' <<<"$json")"
          done
          printf '%s' "$json" | bunx wrangler pages secret bulk --project-name "$PROJETO_PAGES"

      # As variáveis já estão gravadas antes da publicação, então uma publicação só basta.
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist/client --project-name "$PROJETO_PAGES" --branch producao --commit-dirty=true

      - name: Registrar a versão (Release no GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOVA: ${{ steps.versao.outputs.nova }}
          ANTERIOR: ${{ steps.versao.outputs.anterior }}
          NOTAS: ${{ inputs.notas }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJETO_PAGES/deployments?env=production"
          dep="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result[0].id')"
          [ -n "$dep" ] && [ "$dep" != "null" ] || { echo "::error::Não achei o id da publicação."; exit 1; }
          if [ "$ANTERIOR" = "nenhuma" ]; then desde=""; else desde="$ANTERIOR"; fi
          commits="$(git log --no-merges --pretty='- %s' ${desde:+$desde..}HEAD~1 | grep -v -E '^- (Diário|Versão [0-9])' | head -40 || true)"
          {
            echo "${NOTAS:-Versão $NOVA do Flow.}"
            echo
            echo "### Mudanças desde ${ANTERIOR}"
            echo "${commits:-- (sem mudanças de código)}"
            echo
            echo "<!-- cloudflare-deployment: $dep -->"
          } > /tmp/notas.md
          gh release create "v$NOVA" --title "Flow $NOVA" --notes-file /tmp/notas.md --target "$RAMO"
          echo "Versão $NOVA no ar em https://cortaiapp.pages.dev (publicação $dep)"
