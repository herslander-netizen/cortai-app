name: Aplicar migrações novas (cortai-preview)

# Mantém o banco de TESTES da prévia (cortai-preview) em dia com as migrações do repositório, pela API do Supabase
# (SUPABASE_ACCESS_TOKEN), com o mesmo script do banco real. Alvo fixo: nunca o cortai-prod.
# Só roda à mão, só nesta branch e com a confirmação digitada. Cada arquivo numa transação;
# arquivos já registrados em cortai_controle.migracoes_aplicadas são pulados.
on:
  # O push só registra a automação no GitHub; sem a confirmação APLICAR o job é pulado.
  push:
    branches: [cloudflare-workers-migration-2026-10-13]
    paths: [.github/workflows/aplicar-migracoes-previa.yml]
  workflow_dispatch:
    inputs:
      arquivos:
        description: "Migrações a aplicar, separadas por espaço (ex.: drizzle/migrations/0054_x.sql)"
        required: true
        type: string
      confirmar:
        description: "Digite APLICAR para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: montar-cortai-preview
  cancel-in-progress: false

jobs:
  aplicar:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13' && inputs.confirmar == 'APLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Apply new migrations to the preview database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJETO_ESPERADO: pfkxvindedkuktogbcsv
          URL_DO_APP: https://previa.cortaiapp.pages.dev
          ARQUIVOS: ${{ inputs.arquivos }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          # Trava extra: este workflow nunca aponta para o banco real.
          [ "$PROJETO_ESPERADO" != "ibsberidejlbczxrweqg" ] || { echo "::error::Alvo é o cortai-prod; recusado."; exit 1; }
          for a in $ARQUIVOS; do
            [[ "$a" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::Nome inválido: $a"; exit 1; }
          done
          bash supabase/baseline/aplicar-migracoes-novas.sh $ARQUIVOS
