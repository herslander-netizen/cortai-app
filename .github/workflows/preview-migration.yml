name: Validar e publicar a prévia a cada envio

# Decisão do dono (16/10/2026): cada envio na branch vai para a prévia
# (previa.cortaiapp.pages.dev) para ele ver na hora. O site principal só muda quando o dono
# disser "mande pra main": aí roda o "Lançar versão" (versão numerada, com "Voltar versão").

on:
  push:
    branches:
      - cloudflare-workers-migration-2026-10-13
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortai-migration-preview
  # Não interrompe um deploy já iniciado. O GitHub mantém só a execução pendente mais recente.
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Vite/TanStack Router gera src/routeTree.gen.ts; isso precisa ocorrer antes do tsc
      # quando a branch adiciona uma rota nova. O build continua sendo validado antes dos testes.
      - name: Build migration preview
        run: bunx vite build --outDir /tmp/cortai-preview-build
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run

  deploy-isolated-preview:
    needs: validate-build
    # The job itself checks dedicated preview credentials and safely skips deployment if absent.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check isolated preview secrets
        id: gate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          faltam=()
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PREVIEW_SUPABASE_URL PREVIEW_SUPABASE_PUBLISHABLE_KEY PREVIEW_SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!n}" ] || faltam+=("$n")
          done
          if (( ${#faltam[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deployment skipped: missing required isolated-preview secrets: ${faltam[*]}"
          elif [[ "$PREVIEW_SUPABASE_URL" == *"ibsberidejlbczxrweqg.supabase.co"* ]]; then
            echo "::error::PREVIEW_SUPABASE_URL points to production cortai-prod; refusing to deploy preview against production database."
            exit 1
          elif [[ "$PREVIEW_SUPABASE_SERVICE_ROLE_KEY" == "$PREVIEW_SUPABASE_PUBLISHABLE_KEY" || "$PREVIEW_SUPABASE_SERVICE_ROLE_KEY" == sb_publishable_* ]]; then
            echo "::error::PREVIEW_SUPABASE_SERVICE_ROLE_KEY is the public Supabase key; refusing to deploy a preview with invalid server credentials."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Prévia no ramo "previa" do mesmo projeto Pages do site principal (previa.<projeto>.pages.dev).
      # Cria o projeto se ainda não existir; o endereço vem da Cloudflare.
      - name: Endereço da prévia
        id: endereco
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJETO_PAGES: cortaiapp
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          resp="$(curl -sS "${auth[@]}" "$api/$PROJETO_PAGES")"
          if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
            corpo="$(jq -nc --arg n "$PROJETO_PAGES" '{name:$n, production_branch:"producao",
              deployment_configs:{production:{compatibility_date:"2026-10-13",compatibility_flags:["nodejs_compat"]},
                                  preview:{compatibility_date:"2026-10-13",compatibility_flags:["nodejs_compat"]}}}')"
            resp="$(curl -sS "${auth[@]}" -X POST "$api" --data "$corpo")"
            [ "$(jq -r '.success' <<<"$resp")" = "true" ] || { echo "::error::$(jq -c '.errors' <<<"$resp")"; exit 1; }
          fi
          sub="$(jq -r '.result.subdomain' <<<"$resp")"
          echo "projeto=$PROJETO_PAGES" >> "$GITHUB_OUTPUT"
          echo "url=https://previa.$sub" >> "$GITHUB_OUTPUT"
          echo "Prévia: https://previa.$sub"
      - name: Checkout migration branch
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Bun
        if: steps.gate.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Build with isolated preview configuration
        if: steps.gate.outputs.ready == 'true'
        env:
          # Banco EXCLUSIVO de testes. Nunca apontar a prévia para cortai-prod.
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          # Links de compartilhar e prévias de link no navegador apontam para a prévia (src/lib/origem-publica.ts).
          VITE_CORTAI_PUBLIC_URL: ${{ steps.endereco.outputs.url }}
        run: |
          # Só a raiz do projeto (https://<ref>.supabase.co): sem /rest/v1, /auth/v1 nem barra final.
          VITE_SUPABASE_URL="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '\r\n ' | sed -E 's#/(rest|auth)/v1/?$##; s#/+$##')"
          export VITE_SUPABASE_URL
          bunx vite build
      # O Worker vai em _worker.js/ e os estáticos são servidos direto.
      - name: Montar pacote do Pages
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # O build deixa um apontador para dist/server/wrangler.json, que confunde o Pages.
          rm -rf .wrangler
          cd dist
          rm -f server/wrangler.json
          mv server client/_worker.js
          # Marcador exclusivo deste workflow: o smoke test provará qual commit a URL serve.
          marcador="__deploy-check-${GITHUB_RUN_ID}.json"
          printf '{"commit":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "client/$marcador"
          excluir=$(cd client && for f in *; do
            [ "$f" = "_worker.js" ] && continue
            if [ -d "$f" ]; then echo "/$f/*"; else echo "/$f"; fi
          done | jq -R . | jq -sc .)
          jq -n --argjson ex "$excluir" '{version:1, include:["/*"], exclude:$ex}' > client/_routes.json
      - name: Deploy preview
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist/client --project-name "${{ steps.endereco.outputs.projeto }}" --branch previa --commit-dirty=true
      # Variáveis do servidor (lidas em process.env pelo Worker). Só vão as que existem
      # nos segredos do GitHub; nada fica no código nem no log.
      - name: Send server secrets to the preview Worker
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          CORTAI_PUBLIC_BASE_URL: ${{ steps.endereco.outputs.url }}
          CORTAI_CRON_SECRET: ${{ secrets.PREVIEW_CORTAI_CRON_SECRET }}
          CORTAI_AI_PROVIDER: ${{ secrets.PREVIEW_CORTAI_AI_PROVIDER }}
          CORTAI_AI_BASE_URL: ${{ secrets.PREVIEW_CORTAI_AI_BASE_URL }}
          CORTAI_AI_MODEL: ${{ secrets.PREVIEW_CORTAI_AI_MODEL }}
          CORTAI_AI_API_KEY: ${{ secrets.PREVIEW_CORTAI_AI_API_KEY }}
          CORTAI_AI_CANAIS: ${{ secrets.PREVIEW_CORTAI_AI_CANAIS }}
          CORTAI_AI_FALLBACK_BASE_URL: ${{ secrets.PREVIEW_CORTAI_AI_FALLBACK_BASE_URL }}
          CORTAI_AI_FALLBACK_MODEL: ${{ secrets.PREVIEW_CORTAI_AI_FALLBACK_MODEL }}
          CORTAI_AI_FALLBACK_API_KEY: ${{ secrets.PREVIEW_CORTAI_AI_FALLBACK_API_KEY }}
          CORTAI_AI_FALLBACK_TIMEOUT_MS: ${{ secrets.PREVIEW_CORTAI_AI_FALLBACK_TIMEOUT_MS }}
          CORTAI_AI_FALLBACK_REASONING_EFFORT: ${{ secrets.PREVIEW_CORTAI_AI_FALLBACK_REASONING_EFFORT }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.PREVIEW_META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.PREVIEW_META_WHATSAPP_PHONE_NUMBER_ID }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.PREVIEW_META_WHATSAPP_VERIFY_TOKEN }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.PREVIEW_META_WHATSAPP_APP_SECRET }}
          # Evolution API (WhatsApp por QR Code): ver docs/instalar-evolution.md.
          EVOLUTION_API_URL: ${{ secrets.PREVIEW_EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.PREVIEW_EVOLUTION_API_KEY }}
          EVOLUTION_WEBHOOK_SECRET: ${{ secrets.PREVIEW_EVOLUTION_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          nomes=(SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY CORTAI_PUBLIC_BASE_URL
            CORTAI_CRON_SECRET CORTAI_AI_PROVIDER CORTAI_AI_BASE_URL CORTAI_AI_MODEL CORTAI_AI_API_KEY
            CORTAI_AI_CANAIS CORTAI_AI_FALLBACK_BASE_URL CORTAI_AI_FALLBACK_MODEL CORTAI_AI_FALLBACK_API_KEY
            CORTAI_AI_FALLBACK_TIMEOUT_MS CORTAI_AI_FALLBACK_REASONING_EFFORT
            META_WHATSAPP_ACCESS_TOKEN META_WHATSAPP_PHONE_NUMBER_ID
            META_WHATSAPP_VERIFY_TOKEN META_WHATSAPP_APP_SECRET
            EVOLUTION_API_URL EVOLUTION_API_KEY EVOLUTION_WEBHOOK_SECRET)
          json='{}'; enviados=()
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n ' | sed -E 's#/(rest|auth)/v1/?$##; s#/+$##')"
          for n in "${nomes[@]}"; do
            v="$(printf '%s' "${!n}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$v" ] || continue
            json="$(jq -c --arg k "$n" --arg v "$v" '. + {($k): $v}' <<<"$json")"
            enviados+=("$n")
          done
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::PREVIEW_SUPABASE_SERVICE_ROLE_KEY ausente: login, agenda e funções do servidor não vão funcionar na prévia."
          fi
          printf '%s' "$json" | bunx wrangler pages secret bulk --project-name "${{ steps.endereco.outputs.projeto }}" --env preview
          echo "Variáveis enviadas: ${enviados[*]}"
      # As variáveis valem para publicações feitas depois delas: publica de novo.
      - name: Deploy preview com as variáveis
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist/client --project-name "${{ steps.endereco.outputs.projeto }}" --branch previa --commit-dirty=true
      - name: Smoke test da prévia publicada
        if: steps.gate.outputs.ready == 'true'
        env:
          PREVIEW_URL: ${{ steps.endereco.outputs.url }}
        run: |
          set -euo pipefail
          arquivo="__deploy-check-${GITHUB_RUN_ID}.json"
          alvo="${PREVIEW_URL%/}/${arquivo}?run=${GITHUB_RUN_ID}"
          for tentativa in $(seq 1 12); do
            corpo="$(curl -fsS --connect-timeout 5 --max-time 15 "$alvo" 2>/dev/null || true)"
            if [ -n "$corpo" ] && jq -e --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '.commit == $commit and .run_id == $run' <<< "$corpo" >/dev/null; then
              echo "OK: a prévia está servindo o commit $GITHUB_SHA (execução $GITHUB_RUN_ID)."
              exit 0
            fi
            echo "Tentativa ${tentativa}/12: aguardando a URL refletir a publicação."
            sleep 3
          done
          echo "::error::O deploy terminou, mas ${PREVIEW_URL} não serviu o artefato esperado do commit ${GITHUB_SHA}."
          exit 1
