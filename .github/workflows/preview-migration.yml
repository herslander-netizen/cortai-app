name: Validar a cada envio (TypeScript, testes e build)

# Sem prévia desde 16/10/2026 (decisão do dono): o site principal recebe versões numeradas pelo
# "Lançar versão" e volta na hora pelo "Voltar versão". Aqui só se confere que o código monta.

on:
  push:
    branches:
      - cloudflare-workers-migration-2026-10-13
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortai-migration-preview
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
      - name: Build migration preview
        run: bunx vite build --outDir /tmp/cortai-preview-build
