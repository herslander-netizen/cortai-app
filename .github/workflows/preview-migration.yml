name: Cortaí Migration Preview

on:
  push:
    branches:
      - cloudflare-workers-migration-2026-10-13
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortai-migration-preview
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
      - name: Build migration preview
        run: bunx vite build --outDir /tmp/cortai-preview-build
      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortai-migration-preview-${{ github.sha }}
          path: /tmp/cortai-preview-build/
          if-no-files-found: error
          retention-days: 14

  deploy-isolated-preview:
    needs: validate-build
    # The job itself checks dedicated preview credentials and safely skips deployment if absent.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check isolated preview secrets
        id: gate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deployment skipped: configure Cloudflare credentials and dedicated test Supabase secrets first."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout migration branch
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
      - name: Set up Bun
        if: steps.gate.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Build with isolated preview configuration
        if: steps.gate.outputs.ready == 'true'
        env:
          # Projeto da prévia (cortai-prod). Endereço e chave pública vão para o navegador: não são segredos.
          VITE_SUPABASE_URL: https://ibsberidejlbczxrweqg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jGNr3ZXqTm603K_TtSK8rQ_sbQQT6IF
          # Links de compartilhar e prévias de link no navegador apontam para a prévia (src/lib/origem-publica.ts).
          VITE_CORTAI_PUBLIC_URL: https://previa.cortai.pages.dev
        run: |
          # Só a raiz do projeto (https://<ref>.supabase.co): sem /rest/v1, /auth/v1 nem barra final.
          VITE_SUPABASE_URL="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '\r\n ' | sed -E 's#/(rest|auth)/v1/?$##; s#/+$##')"
          export VITE_SUPABASE_URL
          bunx vite build
      # Prévia no mesmo projeto do site principal (Cloudflare Pages "cortai"), no ramo "previa":
      # https://previa.cortai.pages.dev. O Worker vai em _worker.js/ e os estáticos são servidos direto.
      - name: Montar pacote do Pages
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # O build deixa um apontador para dist/server/wrangler.json, que confunde o Pages.
          rm -rf .wrangler
          cd dist
          rm -f server/wrangler.json
          mv server client/_worker.js
          excluir=$(cd client && for f in *; do
            [ "$f" = "_worker.js" ] && continue
            if [ -d "$f" ]; then echo "/$f/*"; else echo "/$f"; fi
          done | jq -R . | jq -sc .)
          jq -n --argjson ex "$excluir" '{version:1, include:["/*"], exclude:$ex}' > client/_routes.json
      - name: Deploy preview (previa.cortai.pages.dev)
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist/client --project-name cortai --branch previa --commit-dirty=true
      # Variáveis do servidor (lidas em process.env pelo Worker). Só vão as que existem
      # nos segredos do GitHub; nada fica no código nem no log.
      - name: Send server secrets to the preview Worker
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: https://ibsberidejlbczxrweqg.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_jGNr3ZXqTm603K_TtSK8rQ_sbQQT6IF
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          CORTAI_PUBLIC_BASE_URL: https://previa.cortai.pages.dev
          CORTAI_CRON_SECRET: ${{ secrets.PREVIEW_CORTAI_CRON_SECRET }}
          CORTAI_AI_PROVIDER: ${{ secrets.PREVIEW_CORTAI_AI_PROVIDER }}
          CORTAI_AI_BASE_URL: ${{ secrets.PREVIEW_CORTAI_AI_BASE_URL }}
          CORTAI_AI_MODEL: ${{ secrets.PREVIEW_CORTAI_AI_MODEL }}
          CORTAI_AI_API_KEY: ${{ secrets.PREVIEW_CORTAI_AI_API_KEY }}
          CORTAI_AI_CANAIS: ${{ secrets.PREVIEW_CORTAI_AI_CANAIS }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.PREVIEW_META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.PREVIEW_META_WHATSAPP_PHONE_NUMBER_ID }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.PREVIEW_META_WHATSAPP_VERIFY_TOKEN }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.PREVIEW_META_WHATSAPP_APP_SECRET }}
        run: |
          set -euo pipefail
          nomes=(SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY CORTAI_PUBLIC_BASE_URL
            CORTAI_CRON_SECRET CORTAI_AI_PROVIDER CORTAI_AI_BASE_URL CORTAI_AI_MODEL CORTAI_AI_API_KEY
            CORTAI_AI_CANAIS META_WHATSAPP_ACCESS_TOKEN META_WHATSAPP_PHONE_NUMBER_ID
            META_WHATSAPP_VERIFY_TOKEN META_WHATSAPP_APP_SECRET)
          json='{}'; enviados=()
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n ' | sed -E 's#/(rest|auth)/v1/?$##; s#/+$##')"
          for n in "${nomes[@]}"; do
            v="$(printf '%s' "${!n}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$v" ] || continue
            json="$(jq -c --arg k "$n" --arg v "$v" '. + {($k): $v}' <<<"$json")"
            enviados+=("$n")
          done
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::PREVIEW_SUPABASE_SERVICE_ROLE_KEY ausente: login, agenda e funções do servidor não vão funcionar na prévia."
          fi
          printf '%s' "$json" | bunx wrangler pages secret bulk --project-name cortai --env preview
          echo "Variáveis enviadas: ${enviados[*]}"
      # As variáveis valem para publicações feitas depois delas: publica de novo.
      - name: Deploy preview com as variáveis
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist/client --project-name cortai --branch previa --commit-dirty=true
