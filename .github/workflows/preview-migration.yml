name: Cortaí Migration Preview

on:
  push:
    branches:
      - cloudflare-workers-migration-2026-10-13
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cortai-migration-preview
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
      - name: Build migration preview
        run: bunx vite build --outDir /tmp/cortai-preview-build
      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortai-migration-preview-${{ github.sha }}
          path: /tmp/cortai-preview-build/
          if-no-files-found: error
          retention-days: 14

  deploy-isolated-preview:
    needs: validate-build
    # The job itself checks dedicated preview credentials and safely skips deployment if absent.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check isolated preview secrets
        id: gate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$PREVIEW_SUPABASE_URL" || -z "$PREVIEW_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deployment skipped: configure Cloudflare credentials and dedicated test Supabase secrets first."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout migration branch
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
      - name: Set up Bun
        if: steps.gate.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Build with isolated preview configuration
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: bunx vite build
      - name: Deploy isolated preview Worker
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config dist/server/wrangler.json --name cortai-reconstruction-test-2026
