name: Fila de espera - RPC PostgREST HTTP (descartavel)

# Apenas bancada isolada: PostgreSQL + PostgREST + JWTs fictícios.
# Nenhum secret, Supabase remoto, dado real ou publicação.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, "cloudflare-workers-migration-2026-10-13"]
    paths:
      - ".github/workflows/fila-postgrest-http.yml"
      - "tests/sql/test_fila_postgrest_http.py"
      - "tests/sql/test_fila_concorrencia_postgres.py"
      - "tests/sql/fila-ofertas-postgres-fixture.sql"
      - "docs/sql/fila-ofertas-transacionais-proposta-2026-11-12.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-fila-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fila-http:
    name: Fila / JWT / PostgREST HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: fila_fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fila_fixture_only
      PGDATABASE: postgres
      TEST_DATABASE_URL: postgresql://postgres:fila_fixture_only@127.0.0.1:5432/postgres
      TEST_POSTGREST_URL: http://127.0.0.1:3000
      TEST_JWT_SECRET: flow-fila-http-fixture-not-production-secret-20261114
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar cliente PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Preparar esquema descartável e proposta SQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/fila-ofertas-postgres-fixture.sql
          preflight="$(psql -v ON_ERROR_STOP=1 -At -f tests/sql/fila-ofertas-preflight-leitura.sql)"
          echo "$preflight" | grep -q 't'
          psql -v ON_ERROR_STOP=1 -f docs/sql/fila-ofertas-transacionais-proposta-2026-11-12.sql
      - name: PostgREST local e JWT fictício
        run: |
          docker run --detach --rm --name flow-fila-pgrst \
            --network host \
            -e PGRST_DB_URI="$TEST_DATABASE_URL" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=3000 \
            -e PGRST_JWT_SECRET="$TEST_JWT_SECRET" \
            postgrest/postgrest:v12.2.3
          ready=0
          for i in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$status" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs flow-fila-pgrst
            exit 1
          fi
      - name: Instalar driver PostgreSQL fixado
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Testar cinco RPCs com tokens JWT fictícios
        run: python -u tests/sql/test_fila_postgrest_http.py
      - name: Diagnóstico em falha
        if: failure()
        run: docker logs flow-fila-pgrst || true
