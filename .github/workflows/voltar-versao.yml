name: Voltar versão (site principal)

# "Reboot" para uma versão anterior, na hora: a Cloudflare guarda cada publicação e só troca qual
# está no ar (sem montar de novo). Sem informar a versão, volta para a anterior à que está no ar.
# Não desfaz migrações de banco (o banco é tratado à parte, como manda o AGENTS.md).
on:
  push:
    branches: [cloudflare-workers-migration-2026-10-13]
    paths: [.github/workflows/voltar-versao.yml]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão para voltar (ex.: 3.1). Vazio = a anterior à que está no ar"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cortai-lancar-versao
  cancel-in-progress: false

env:
  PROJETO_PAGES: cortaiapp

jobs:
  voltar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Voltar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEDIDA: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJETO_PAGES"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          no_ar="$(curl -sS "${auth[@]}" "$base" | jq -r '.result.canonical_deployment.id')"
          # Versões lançadas, da mais nova para a mais antiga, com o id da publicação de cada uma.
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' | sort -rV > /tmp/tags
          alvo_tag=""; alvo_dep=""
          if [ -n "$PEDIDA" ]; then
            alvo_tag="v${PEDIDA#v}"
            grep -qx "$alvo_tag" /tmp/tags || { echo "::error::Versão $alvo_tag não existe. Lançadas: $(tr '\n' ' ' < /tmp/tags)"; exit 1; }
            alvo_dep="$(gh release view "$alvo_tag" --repo "$REPO" --json body --jq .body | sed -n 's/.*cloudflare-deployment: \([^ ]*\) .*/\1/p')"
          else
            # A anterior à que está no ar.
            achou_no_ar=0
            while read -r tag; do
              dep="$(gh release view "$tag" --repo "$REPO" --json body --jq .body | sed -n 's/.*cloudflare-deployment: \([^ ]*\) .*/\1/p')"
              if [ "$achou_no_ar" = 1 ] && [ -n "$dep" ]; then alvo_tag="$tag"; alvo_dep="$dep"; break; fi
              [ "$dep" = "$no_ar" ] && achou_no_ar=1
            done < /tmp/tags
            [ -n "$alvo_tag" ] || { echo "::error::Não há versão anterior à que está no ar."; exit 1; }
          fi
          [ -n "$alvo_dep" ] || { echo "::error::A versão $alvo_tag não tem id de publicação registrado."; exit 1; }
          if [ "$alvo_dep" = "$no_ar" ]; then echo "A versão $alvo_tag já está no ar."; exit 0; fi
          r="$(curl -sS "${auth[@]}" -X POST "$base/deployments/$alvo_dep/rollback")"
          [ "$(jq -r '.success' <<<"$r")" = "true" ] || { echo "::error::A Cloudflare recusou: $(jq -c '.errors' <<<"$r")"; exit 1; }
          echo "No ar agora: $alvo_tag (publicação $alvo_dep) em https://cortaiapp.pages.dev"
