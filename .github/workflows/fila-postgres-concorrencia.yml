name: Fila de espera - PostgreSQL concorrente (descartavel)

# Exclusivo ao PR #55. Sem secrets, sem Supabase e sem qualquer deploy.
# Ações são executadas apenas no container efêmero do job.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, "cloudflare-workers-migration-2026-10-13"]
    paths:
      - ".github/workflows/fila-postgres-concorrencia.yml"
      - "tests/sql/fila-ofertas-postgres-fixture.sql"
      - "tests/sql/test_fila_concorrencia_postgres.py"
      - "tests/sql/fila-ofertas-preflight-leitura.sql"
      - "docs/sql/fila-ofertas-transacionais-proposta-2026-11-12.sql"

permissions:
  contents: read

jobs:
  postgres-fila:
    if: ${{ github.event.pull_request.number == 55 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: isolated_test_only
      PGDATABASE: postgres
      TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/postgres

    steps:
      - name: Checkout PR (somente leitura)
        uses: actions/checkout@v4
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cliente PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -c "SELECT version();"
      - name: Esquema minimo e preflight antes da proposta
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/fila-ofertas-postgres-fixture.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/fila-ofertas-preflight-leitura.sql
      - name: Aplicar SQL proposto SOMENTE no PostgreSQL efemero
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/sql/fila-ofertas-transacionais-proposta-2026-11-12.sql
      - name: Instalar driver Python (somente job)
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Corridas reais entre conexoes + pos-condicoes
        run: python -u tests/sql/test_fila_concorrencia_postgres.py
      - name: Conferir permissoes das cinco RPCs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          DECLARE
            fn text;
          BEGIN
            FOREACH fn IN ARRAY ARRAY[
              'reservar_oferta_da_fila',
              'encerrar_oferta_da_fila',
              'aceitar_oferta_da_fila',
              'retirar_entrada_da_fila',
              'converter_entrada_da_fila'
            ] LOOP
              IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid=p.pronamespace
                WHERE n.nspname='public' AND p.proname=fn
              ) THEN
                RAISE EXCEPTION 'RPC ausente: %',fn;
              END IF;
            END LOOP;
            IF EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public'
                AND p.proname IN (
                  'reservar_oferta_da_fila',
                  'encerrar_oferta_da_fila',
                  'aceitar_oferta_da_fila',
                  'retirar_entrada_da_fila',
                  'converter_entrada_da_fila'
                )
                AND (
                  has_function_privilege('anon',p.oid,'EXECUTE')
                  OR has_function_privilege('authenticated',p.oid,'EXECUTE')
                  OR NOT has_function_privilege('service_role',p.oid,'EXECUTE')
                )
            ) THEN
              RAISE EXCEPTION 'Permissoes inconsistentes nas RPCs da fila';
            END IF;
            RAISE NOTICE '5 RPCs presentes e permisos de EXECUTE restritos a service_role';
          END
          $check$;
          SQL
