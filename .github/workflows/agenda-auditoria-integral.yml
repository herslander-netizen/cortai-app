name: Flow - Auditoria automatizada da Agenda

# Apenas validacao. Sem secrets, sem login real, sem deploy, sem Supabase.
# O workflow Validate Flow ja executa build, TypeScript e a suite completa.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, "cloudflare-workers-migration-2026-10-13"]
    paths:
      - ".github/workflows/agenda-auditoria-integral.yml"
      - "scripts/ci/agenda-testes.mjs"
      - "tests/agenda-browser/**"
      # Não disparar 6 runners quando mudar qualquer módulo do app.
      # A validação geral já executa Vitest e TypeScript.
      - "src/components/barbeiro/agenda/TrocaDeVisualizacao.tsx"
      - "src/components/barbeiro/agenda/ListaAgenda.tsx"
      - "src/components/barbeiro/AgendaTimeline.tsx"
      - "src/styles.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-agenda-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testes-por-funcionalidade:
    name: Agenda / ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        area: [operacao, regras, clientes, atendimento, desempenho]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependencias congeladas
        run: bun install --frozen-lockfile
      - name: Executar todos os testes descobertos do dominio
        run: node scripts/ci/agenda-testes.mjs "${{ matrix.area }}"

  chromium-multitela:
    name: Agenda / Chromium 360 390 1280
    # Playwright 1.56 suporta 24.04; ubuntu-latest usa 26.04 no Actions atual.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependencias da aplicacao
        run: bun install --frozen-lockfile
      - name: Instalar Playwright temporariamente no runner
        run: npm install --no-save --ignore-scripts --package-lock=false @playwright/test@1.56.1
      - name: Chromium para o runner
        run: npx playwright install --with-deps chromium
      - name: Navegar componentes reais isolados com dados ficticios
        run: npx playwright test --config tests/agenda-browser/playwright.config.ts
      - name: Preservar evidencias quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flow-agenda-browser-evidencias
          path: |
            playwright-report/
            test-results/
            tests/agenda-browser/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
