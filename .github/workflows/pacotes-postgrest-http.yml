name: Pacotes - HTTP autenticado PostgREST

# Integração de ponta a ponta API: JWT fictício -> PostgREST -> RPC real -> RLS.
# Postgres e PostgREST locais/descartáveis. Sem segredos e sem Supabase real.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, "cloudflare-workers-migration-2026-10-13"]
    paths:
      - ".github/workflows/pacotes-postgrest-http.yml"
      - "tests/sql/test_pacotes_postgrest_http.py"
      - "tests/sql/test_pacotes_atomico_postgres.py"
      - "tests/sql/pacotes-atomico-fixture.sql"
      - "drizzle/migrations/0046_pacotes_e_combos.sql"
      - "drizzle/migrations/0062_pacotes_salvar_atomico.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figaroo-pacotes-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rpc-http:
    name: PostgREST HTTP / JWT / RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pacote_fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: pacote_fixture_only
      PGDATABASE: postgres
      TEST_DATABASE_URL: postgresql://postgres:pacote_fixture_only@127.0.0.1:5432/postgres
      TEST_POSTGREST_URL: http://127.0.0.1:3000
      TEST_JWT_SECRET: flow-http-fixture-nonproduction-secret-only-20261112
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cliente PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -c 'SELECT version()'
      - name: Fixture autenticação e dados fictícios
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/pacotes-atomico-fixture.sql
      - name: Migrações reais no banco efêmero
        run: |
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0046_pacotes_e_combos.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0062_pacotes_salvar_atomico.sql
      - name: PostgREST local com JWT somente de teste
        run: |
          docker run --detach --rm --name flow-pacotes-pgrst \
            --network host \
            -e PGRST_DB_URI="$TEST_DATABASE_URL" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=3000 \
            -e PGRST_JWT_SECRET="$TEST_JWT_SECRET" \
            postgrest/postgrest:v12.2.3
          ready=0
          for i in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$status" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs flow-pacotes-pgrst
            exit 1
          fi
      - name: Driver isolado
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Exercitar onze jornadas REST com JWT e RLS
        run: python -u tests/sql/test_pacotes_postgrest_http.py
      - name: Log de falha (sem credenciais reais)
        if: failure()
        run: docker logs flow-pacotes-pgrst || true
