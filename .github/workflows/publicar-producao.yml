name: Publicar Cortaí (site principal)

# O "Publish" do Lovable: leva a versão testada na prévia para o site principal
# (Cloudflare Pages, projeto "cortai" → https://cortai.pages.dev). Só roda à mão, nesta
# branch, com PUBLICAR digitado. Não mexe no banco, na main nem no domínio cortai.dev.
on:
  # O push só registra o botão no GitHub; sem PUBLICAR digitado o job é pulado.
  push:
    branches: [cloudflare-workers-migration-2026-10-13]
    paths: [.github/workflows/publicar-producao.yml]
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite PUBLICAR para colocar no ar a versão que está na prévia"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cortai-publicar-producao
  cancel-in-progress: false

env:
  PROJETO_PAGES: cortai
  SUPABASE_URL_PUBLICA: https://ibsberidejlbczxrweqg.supabase.co
  SUPABASE_CHAVE_PUBLICA: sb_publishable_jGNr3ZXqTm603K_TtSK8rQ_sbQQT6IF

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cloudflare-workers-migration-2026-10-13' && inputs.confirmar == 'PUBLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da versão testada
        uses: actions/checkout@v4
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependências
        run: bun install --frozen-lockfile
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tsc --noEmit -p .
      - name: Testes
        run: bunx vitest run

      - name: Projeto no Cloudflare Pages (cria na primeira vez)
        id: projeto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          resp="$(curl -sS "${auth[@]}" "$api/$PROJETO_PAGES")"
          if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
            corpo="$(jq -nc --arg n "$PROJETO_PAGES" '{name:$n, production_branch:"producao",
              deployment_configs:{production:{compatibility_date:"2026-10-13",compatibility_flags:["nodejs_compat"]},
                                  preview:{compatibility_date:"2026-10-13",compatibility_flags:["nodejs_compat"]}}}')"
            resp="$(curl -sS "${auth[@]}" -X POST "$api" --data "$corpo")"
            if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
              echo "::error::Não consegui criar o projeto: $(jq -c '.errors' <<<"$resp")"
              exit 1
            fi
          fi
          sub="$(jq -r '.result.subdomain' <<<"$resp")"
          echo "endereco=https://$sub" >> "$GITHUB_OUTPUT"
          echo "Endereço do site principal: https://$sub"
          [ "$sub" = "$PROJETO_PAGES.pages.dev" ] || echo "::warning::O nome cortai.pages.dev já era de outra pessoa; a Cloudflare deu https://$sub"

      - name: Build do site principal
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL_PUBLICA }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_CHAVE_PUBLICA }}
          VITE_CORTAI_PUBLIC_URL: ${{ steps.projeto.outputs.endereco }}
        run: bunx vite build

      # O build gera um Worker (dist/server) e os arquivos estáticos (dist/client). No Pages o
      # Worker vai em _worker.js/ e os estáticos são servidos direto (lista em _routes.json).
      - name: Montar pacote do Pages
        run: |
          set -euo pipefail
          cd dist
          rm -f server/wrangler.json
          mv server client/_worker.js
          excluir=$(cd client && for f in *; do
            [ "$f" = "_worker.js" ] && continue
            if [ -d "$f" ]; then echo "/$f/*"; else echo "/$f"; fi
          done | jq -R . | jq -sc .)
          jq -n --argjson ex "$excluir" '{version:1, include:["/*"], exclude:$ex}' > client/_routes.json
          cat client/_routes.json

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist/client --project-name "$PROJETO_PAGES" --branch producao --commit-dirty=true

      # Mesmo banco da prévia por enquanto (decisão do dono, 16/10): mesmas chaves do servidor.
      - name: Variáveis do servidor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ env.SUPABASE_URL_PUBLICA }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_CHAVE_PUBLICA }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
          CORTAI_PUBLIC_BASE_URL: ${{ steps.projeto.outputs.endereco }}
          CORTAI_CRON_SECRET: ${{ secrets.PREVIEW_CORTAI_CRON_SECRET }}
          CORTAI_AI_PROVIDER: ${{ secrets.PREVIEW_CORTAI_AI_PROVIDER }}
          CORTAI_AI_BASE_URL: ${{ secrets.PREVIEW_CORTAI_AI_BASE_URL }}
          CORTAI_AI_MODEL: ${{ secrets.PREVIEW_CORTAI_AI_MODEL }}
          CORTAI_AI_API_KEY: ${{ secrets.PREVIEW_CORTAI_AI_API_KEY }}
          CORTAI_AI_CANAIS: ${{ secrets.PREVIEW_CORTAI_AI_CANAIS }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.PREVIEW_META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.PREVIEW_META_WHATSAPP_PHONE_NUMBER_ID }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.PREVIEW_META_WHATSAPP_VERIFY_TOKEN }}
          META_WHATSAPP_APP_SECRET: ${{ secrets.PREVIEW_META_WHATSAPP_APP_SECRET }}
        run: |
          set -euo pipefail
          nomes=(SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY CORTAI_PUBLIC_BASE_URL
            CORTAI_CRON_SECRET CORTAI_AI_PROVIDER CORTAI_AI_BASE_URL CORTAI_AI_MODEL CORTAI_AI_API_KEY
            CORTAI_AI_CANAIS META_WHATSAPP_ACCESS_TOKEN META_WHATSAPP_PHONE_NUMBER_ID
            META_WHATSAPP_VERIFY_TOKEN META_WHATSAPP_APP_SECRET)
          json='{}'; enviados=()
          for n in "${nomes[@]}"; do
            v="$(printf '%s' "${!n}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$v" ] || continue
            json="$(jq -c --arg k "$n" --arg v "$v" '. + {($k): $v}' <<<"$json")"
            enviados+=("$n")
          done
          printf '%s' "$json" | bunx wrangler pages secret bulk --project-name "$PROJETO_PAGES"
          echo "Variáveis enviadas: ${enviados[*]}"

      # As variáveis só valem para publicações feitas depois delas: publica de novo
      # para a versão no ar já subir com tudo (na primeira vez isso é necessário).
      - name: Publicar com as variáveis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist/client --project-name "$PROJETO_PAGES" --branch producao --commit-dirty=true

      - name: Marcar a versão publicada
        run: |
          set -euo pipefail
          tag="producao-$(date -u +%Y%m%d-%H%M)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Versão publicada: $GITHUB_SHA ($tag) em ${{ steps.projeto.outputs.endereco }}"
