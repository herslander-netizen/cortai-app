name: Trazer imagens do Lovable para o projeto

# Uso único (16/10): as imagens importadas por src/assets/*.asset.json moram no armazenamento do
# Lovable (/__l5e/assets-v1/...), que não existe no Cloudflare Pages: o logo some fora do Lovable.
# Esta automação baixa cada imagem do site publicado no Lovable, confere o tamanho com o
# registrado no .asset.json, grava em public/marca-lovable/ e troca a "url" do .asset.json para o
# arquivo local. Faz um commit na branch de migração. Não toca em nada além disso.
on:
  push:
    branches: [cloudflare-workers-migration-2026-10-13]
    paths: [.github/workflows/trazer-imagens-lovable.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trazer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-migration-2026-10-13
      - name: Baixar e trocar os endereços
        run: |
          set -euo pipefail
          origens=(
            "https://cortai.dev"
            "https://id-preview--a3550de1-ec98-4622-8484-7dadb8b04ed0.lovable.app"
            "https://cortai.lovable.app"
          )
          mkdir -p public/marca-lovable
          ok=0; faltou=()
          for j in src/assets/*.asset.json; do
            url="$(jq -r '.url' "$j")"
            nome="$(jq -r '.original_filename' "$j")"
            tam="$(jq -r '.size' "$j")"
            case "$url" in /__l5e/*) ;; *) echo "já local: $j"; continue ;; esac
            destino="public/marca-lovable/$nome"
            achou=""
            for o in "${origens[@]}"; do
              code="$(curl -sSL -o "$destino.tmp" -w '%{http_code}' "$o$url" || echo 000)"
              baixado="$(stat -c %s "$destino.tmp" 2>/dev/null || echo 0)"
              tipo="$(file -b --mime-type "$destino.tmp" 2>/dev/null || echo ?)"
              if [ "$code" = "200" ] && [ "$baixado" = "$tam" ] && [[ "$tipo" == image/* ]]; then
                mv "$destino.tmp" "$destino"; achou="$o"; break
              fi
              echo "  $nome em $o: HTTP $code, $baixado bytes (esperado $tam), $tipo"
            done
            rm -f "$destino.tmp"
            if [ -n "$achou" ]; then
              jq --arg u "/marca-lovable/$nome" '.url = $u' "$j" > "$j.novo" && mv "$j.novo" "$j"
              echo "OK $nome ($tam bytes) de $achou"; ok=$((ok+1))
            else
              faltou+=("$nome")
            fi
          done
          echo "Trazidas: $ok"
          if [ ${#faltou[@]} -gt 0 ]; then echo "::warning::Não consegui baixar: ${faltou[*]}"; fi
          [ "$ok" -gt 0 ] || { echo "::error::Nenhuma imagem baixada."; exit 1; }
      - name: Commit na branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/marca-lovable src/assets/*.asset.json
          git commit -m "Imagens da marca trazidas do Lovable para public/marca-lovable

          Os .asset.json apontavam para /__l5e/assets-v1 (armazenamento do Lovable), que não
          existe no Cloudflare Pages: o logo não aparecia. Tamanhos conferidos com os registrados."
          git push origin HEAD:cloudflare-workers-migration-2026-10-13
